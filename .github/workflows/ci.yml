name: CI/CD Pipeline 
 
on: 
  push: 
    branches: [ "main", "develop", "feat/noncustodial-wallet-foundation" ] 
  pull_request: 
    branches: [ "main" ] 
 
jobs: 
  test: 
    runs-on: ubuntu-latest 
    services: 
      postgres: 
        image: postgres:16 
        env: 
          POSTGRES_DB: zigma_db 
          POSTGRES_USER: zigma_user 
          POSTGRES_PASSWORD: zigma_secure_password 
        ports: 
          - 5432:5432 
        options: > - 
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5 
      redis: 
        image: redis:7 
        ports: 
          - 6379:6379 
        options: > - 
          "redis-cli ping" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5 
    steps: 
    - name: Checkout repository 
      uses: actions/checkout@v4 
    - name: Set up Python 
      uses: actions/setup-python@v5 
      with: 
        python-version: '3.12' 
        cache: 'pip' 
    - name: Install Dependencies 
      run: | 
        python -m pip install --upgrade pip 
        pip install -r requirements.txt 
    - name: Run Database Migrations 
      env: 
        DEBUG: "False" 
        SECRET_KEY: "ci-test-key-for-github-actions-pipeline-runs" 
        DB_NAME: zigma_db
        DB_USER: zigma_user
        DB_PASSWORD: zigma_secure_password
        DB_HOST: localhost
        DB_PORT: "5432"
        USE_LOCAL_DB: "False" 
        CELERY_BROKER_URL: redis://localhost:6379/0 
      run: | 
        python manage.py migrate 
    - name: Run Tests 
      env: 
        DEBUG: "False" 
        SECRET_KEY: "ci-test-key-for-github-actions-pipeline-runs" 
        DB_NAME: zigma_db
        DB_USER: zigma_user
        DB_PASSWORD: zigma_secure_password
        DB_HOST: localhost
        DB_PORT: "5432"
        USE_LOCAL_DB: "False" 
        CELERY_BROKER_URL: redis://localhost:6379/0 
      run: | 
        python manage.py test
