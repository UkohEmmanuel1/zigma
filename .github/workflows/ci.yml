name: Zigma CI

on:
  push:
    branches:
      - main
      - develop
      - feat/noncustodial-wallet-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
          USE_LOCAL_DB: "True"
          DJANGO_SETTINGS_MODULE: zigma_core.settings.dev
        run: python manage.py check

      - name: Check migration consistency
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
          USE_LOCAL_DB: "True"
          DJANGO_SETTINGS_MODULE: zigma_core.settings.dev
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
          USE_LOCAL_DB: "True"
          DJANGO_SETTINGS_MODULE: zigma_core.settings.dev
        run: python manage.py migrate --noinput

      - name: Test connected wallet API
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "False"
          USE_LOCAL_DB: "True"
          DJANGO_SETTINGS_MODULE: zigma_core.settings.dev
        run: python manage.py test chain_wallet
